# External Secrets Operator(ESO)가 AWS Secrets Manager 에 접근하는 방법을 정의한다. 클러스터에 1개(앱과 무관한 공용 오브젝트).
#
# 전제: infra `platform` 스택이 ESO 를 Helm 으로 설치하고, ESO 의 ServiceAccount(external-secrets / external-secrets)에
#   Pod Identity 로 IAM 역할(비밀 3개 ARN 의 Get/Describe)을 연결한 뒤에 적용한다. CRD 가 없으면 이 파일은 적용되지 않는다.
#   kubectl get crd clustersecretstores.external-secrets.io   ← 있으면 준비 완료
#
# 인증: auth 블록을 적지 않는다. 그러면 ESO 컨트롤러 Pod 의 기본 자격 증명 체인을 쓰고, Pod Identity 가 그 체인에
#   임시 자격 증명을 넣어 준다. 그래서 역할 ARN·계정 ID 가 이 파일에 없다(IRSA 였다면 ServiceAccount 어노테이션이 필요했다).
#
# ClusterSecretStore(클러스터 범위) vs SecretStore(Namespace 범위): 앱이 하나라 어느 쪽이든 되지만, 뒤 Phase 에
#   Namespace 가 늘어도 Store 를 다시 만들지 않도록 클러스터 범위로 둔다(설계 결정 17).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-northeast-2
