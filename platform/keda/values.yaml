# KEDA 차트(kedacore/keda 2.21.0) 값. argocd/apps/keda.yaml 이 $values/platform/keda/values.yaml 로 읽는다.
# (platform/ 폴더의 platform Application 은 하위 폴더를 읽지 않는다. monitoring/values.yaml 과 같은 배치다.)
#
# 우리가 바꾸는 것은 리소스 요청뿐이다. 차트 기본값은 Pod 3개(operator / metrics-apiserver / admission-webhooks)가 각각 100m / 100Mi 를 요청하고
# CPU limit 1코어를 거는데, 3노드에서 앱 Pod 가 노드 CPU 를 거의 다 쓰는 구성(scripts/check-phase2-render.py)에서는 합계 300m 도 못 쓴다.
# KEDA 는 큐 길이를 15초마다 읽는 정도의 일이라 요청을 줄인다. CPU limit 은 두지 않는다(저장소 규칙). null 은 Helm 이 그 키를 지운다는 뜻이다.
#
# 호환성(2026-11-03 확인): KEDA 2.21 의 시험된 Kubernetes 범위 v1.34 ~ v1.36, 이 클러스터는 EKS 1.35. 차트의 kubeVersion 제약은 >=1.23.
#   (2.20 은 v1.33~v1.35 라 1.35 가 가장자리다. 2.21 은 1.35 가 가운데다.)
# 인증: EKS Pod Identity. operator 의 ServiceAccount 이름 keda-operator 가 infra 의 Pod Identity 연결과 계약이다(cluster 스택이 만든다. 2026-11-04 적용 확인).
#   AWS_CONTAINER_CREDENTIALS_FULL_URI 는 Pod 가 만들어질 때 주입된다 → 연결이 operator Pod 보다 먼저 있어야 한다(없이 시작했다면 operator 를 재시작).

crds:
  install: true # ScaledObject / TriggerAuthentication CRD. Argo CD 가 ServerSideApply 로 적용한다(CRD 가 커서)

operator:
  replicaCount: 1 # 여러 개를 띄워도 리더 1개만 일한다. 장애 복구 시간만 줄어든다. 비용을 위해 1개

serviceAccount:
  operator:
    create: true
    name: keda-operator # infra Pod Identity 연결 대상 (namespace keda, ServiceAccount keda-operator)
    automountServiceAccountToken: true # operator 는 Kubernetes API 를 호출한다(HPA 생성 등). 위 Pod Identity 자격 증명과 별개다

resources:
  operator:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: null
      memory: 256Mi
  metricServer:
    requests:
      cpu: 50m
      memory: 100Mi
    limits:
      cpu: null
      memory: 256Mi
  webhooks:
    requests:
      cpu: 25m
      memory: 64Mi
    limits:
      cpu: null
      memory: 128Mi
