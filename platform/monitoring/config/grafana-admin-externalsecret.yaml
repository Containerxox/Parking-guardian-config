# Grafana 관리자 계정: Secrets Manager parking-guardian/grafana → Kubernetes Secret monitoring/grafana-admin.
# 차트 값 grafana.admin.existingSecret 이 이 Secret 의 admin-user / admin-password 를 읽는다.
#
# 비밀 이름 parking-guardian/grafana 는 infra data 스택이 만든 고정 문자열(계정 ID·ARN 아님)이라 그대로 적는다.
# 값은 Secrets Manager 에만 있다(infra README "비밀 값 주입"). ESO 의 IAM 정책(platform 스택 eso.tf)에 이 비밀의 ARN 이 있어야 읽힌다.
# Secret 이 생기기 전에 Grafana Pod 가 뜨면 CreateContainerConfigError 로 기다리다가 Secret 이 생기면 알아서 시작한다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: parking-guardian/grafana
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: parking-guardian/grafana
        property: admin-password
