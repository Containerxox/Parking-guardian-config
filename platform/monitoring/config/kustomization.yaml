# 모니터링 설정 1벌(Argo CD 앱 monitoring-config). ExternalSecret 과 대시보드 ConfigMap.
# 대시보드: dashboards/*.json 을 configMapGenerator 가 ConfigMap 으로 만들고, 라벨 grafana_dashboard=1 을 보고 Grafana sidecar 가 불러온다.
#   JSON 을 고치면 ConfigMap 해시가 바뀌고 sidecar 가 새 파일을 읽는다(Grafana 재시작 없음). 어노테이션 grafana_folder 가 폴더 이름.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - grafana-admin-externalsecret.yaml
  - slack-webhook-externalsecret.yaml # Alertmanager 의 Slack Webhook URL(2026-11-06 관측성 1단계)
  - rules/pg-alerts.yaml # 알림 규칙(worker·http·pods)
  - rules/pg-alert-test.yaml # 통제된 Firing/Resolved 시험용(평소 침묵)

generatorOptions:
  disableNameSuffixHash: true # 대시보드 ConfigMap 은 이름이 고정이어야 sidecar 가 같은 대시보드로 갱신한다
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Parking Guardian (Phase 2)

# dashboards/*.json 은 build_dashboards.py 가 만든다. JSON 을 직접 고치지 말고 스크립트를 고친 뒤 다시 실행해 커밋한다.
configMapGenerator:
  # Phase 2 (2026-11-06 관측성 1단계): 이미 수집 중인 지표만 쓴다. 폴더 'Parking Guardian (Phase 2)' (generatorOptions 기본값)
  - name: dashboard-overview-phase2
    files:
      - dashboards/overview-phase2.json
  - name: dashboard-infrastructure-phase2
    files:
      - dashboards/infrastructure-phase2.json
  - name: dashboard-pipeline-phase2 # 관측성 2단계: relay /metrics 필요(PodMonitor relay)
    files:
      - dashboards/pipeline-phase2.json
  - name: dashboard-ai-inference-phase2 # 관측성 3단계: worker /metrics 필요(PodMonitor worker)
    files:
      - dashboards/ai-inference-phase2.json
  # Phase 1 대시보드는 삭제하지 않고 보존한다(동기 /device/detections·추론 락 등 Phase 1 지표 기준). 폴더만 'Phase 1 참고' 로 구분한다.
  - name: dashboard-phase-comparison
    files:
      - dashboards/phase-comparison.json
    options:
      annotations:
        grafana_folder: Parking Guardian (Phase 1 참고)
  - name: dashboard-resources
    files:
      - dashboards/resources.json
    options:
      annotations:
        grafana_folder: Parking Guardian (Phase 1 참고)
  - name: dashboard-inference
    files:
      - dashboards/inference.json
    options:
      annotations:
        grafana_folder: Parking Guardian (Phase 1 참고)
