# 모니터링 설정 1벌(Argo CD 앱 monitoring-config). ExternalSecret 과 대시보드 ConfigMap.
# 대시보드: dashboards/*.json 을 configMapGenerator 가 ConfigMap 으로 만들고, 라벨 grafana_dashboard=1 을 보고 Grafana sidecar 가 불러온다.
#   JSON 을 고치면 ConfigMap 해시가 바뀌고 sidecar 가 새 파일을 읽는다(Grafana 재시작 없음). 어노테이션 grafana_folder 가 폴더 이름.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: monitoring

resources:
  - grafana-admin-externalsecret.yaml

generatorOptions:
  disableNameSuffixHash: true # 대시보드 ConfigMap 은 이름이 고정이어야 sidecar 가 같은 대시보드로 갱신한다
  labels:
    grafana_dashboard: "1"
  annotations:
    grafana_folder: Parking Guardian

# dashboards/*.json 은 build_dashboards.py 가 만든다. JSON 을 직접 고치지 말고 스크립트를 고친 뒤 다시 실행해 커밋한다.
configMapGenerator:
  - name: dashboard-phase-comparison
    files:
      - dashboards/phase-comparison.json
  - name: dashboard-resources
    files:
      - dashboards/resources.json
  - name: dashboard-inference
    files:
      - dashboards/inference.json
