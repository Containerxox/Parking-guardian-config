# Parking Guardian 알림 규칙 1단계 (2026-11-06). 이미 수집 중인 지표(kube-state-metrics, backend /metrics)만 쓴다.
# 평가 주기는 Prometheus 기본(evaluationInterval 30s). Alertmanager 라우팅·Slack 은 platform/monitoring/values.yaml 의 alertmanager.config.
# 승인 웹훅이 꺼져 있어(values.yaml) 적용 때 문법 검증이 없다 -> 커밋 전에 promtool check rules 로 반드시 검사한다.
#
# severity 는 두 단계만: critical(바로 사람이 봐야 함, 1시간마다 반복) / warning(4시간마다 반복).
# 한 규칙의 for 는 "일시적인 정상 동작(배포·새 Pod 기동·버스트)을 오탐으로 올리지 않는" 시간이다. 각 규칙의 오탐 가능성과 복구 조건은 annotations 에 적었다.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: pg-platform-alerts
  namespace: monitoring
  labels:
    app.kubernetes.io/part-of: parking-guardian
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  groups:
    - name: parking-guardian.worker
      rules:
        # Worker 가 목표 개수보다 적게 Ready 이다 = 사진 판정 처리 용량 부족(큐 적체·E2E 악화로 이어진다).
        # 오탐: Worker 롤링·새 Pod 기동은 모델 로딩이 있어 보통 1~2분 걸린다 -> for 5m 로 흡수. 복구: Ready 수 >= 목표(spec) 가 되면 자동 해소.
        - alert: PGWorkerNotReady
          expr: |
            kube_deployment_status_replicas_ready{namespace="parking-guardian",deployment="worker"}
              < on (namespace, deployment)
            kube_deployment_spec_replicas{namespace="parking-guardian",deployment="worker"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Worker Ready 부족: {{ $value }}개 Ready (목표보다 적음)"
            description: "worker Deployment 의 Ready Pod 가 목표(spec)보다 5분 넘게 적다. 사진 판정 용량이 줄어 큐가 쌓일 수 있다. kubectl -n parking-guardian get pods -l app.kubernetes.io/name=worker"
        # Worker 가 하나도 Ready 가 아니다 = 판정이 전혀 처리되지 않는다(접수는 계속되어 큐에 쌓인다). 위 경고와 alertname 이 달라 둘 다 울린다(critical 이 먼저 눈에 띈다).
        # 복구: Ready >= 1 이 되면 자동 해소.
        - alert: PGWorkerDown
          expr: |
            (kube_deployment_status_replicas_ready{namespace="parking-guardian",deployment="worker"} == 0)
              and on (namespace, deployment)
            (kube_deployment_spec_replicas{namespace="parking-guardian",deployment="worker"} > 0)
          for: 2m
          labels:
            severity: critical
          annotations:
            summary: "Worker 가 하나도 Ready 가 아니다"
            description: "목표 Worker 가 있는데 Ready 가 0개로 2분 넘게 이어진다. 사진 판정이 멈췄다. 복구: Worker Ready >= 1."
        # 관측성 3단계: E2E(서버 기준 접수 -> 판정 커밋) p95 가 10초를 넘는 상태가 5분 이어진다 = 사용자가 체감할 만큼 느려졌다(목표 10초).
        # p95 는 5분 창 버킷 보간 추정값(10~15초 버킷 안에서 보간). 5분 동안 판정이 5건 미만이면 표본이 적어 평가하지 않는다(오탐 방지; 판정이 아예 없는 것은 PGQueueBacklogSustained·PGPipelineOldestJobAge 가 본다).
        # 오탐: 일시 버스트(실험 2 에서 수 초). for 5m 로 흡수. 복구: p95 <= 10초 또는 표본 5건 미만.
        - alert: PGE2EP95High
          expr: |
            (histogram_quantile(0.95, sum by (le) (rate(pg_job_e2e_seconds_bucket[5m]))) > 10)
              and
            (sum(increase(pg_job_e2e_seconds_count[5m])) >= 5)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "E2E p95 {{ $value | printf \"%.1f\" }}초 (서버 기준 접수 → 판정 저장, 추정값)"
            description: "사진 접수부터 판정 저장까지 p95 가 10초를 5분 넘게 넘는다. SQS 적체(PGQueueBacklogSustained), Worker Ready·KEDA, 추론 단계별 시간(AI Inference & E2E 대시보드)을 확인한다."
        # Worker /metrics 를 읽을 수 없다 = 스크레이프 끊김(또는 PodMonitor 없음). Worker 가 목표 1개 이상인데 up==1 인 대상이 없을 때만(Worker 를 일부러 0 으로 줄이면 PGWorkerDown 이 담당).
        # "지표가 없어서 정상처럼 보이는" 오해를 막는 안전장치(E2E·오류 알림은 지표가 없으면 침묵한다). 복구: 타깃 UP.
        - alert: PGWorkerMetricsMissing
          expr: |
            absent(up{job="parking-guardian/worker"} == 1)
              and on ()
            (max(kube_deployment_spec_replicas{namespace="parking-guardian",deployment="worker"}) > 0)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "Worker 지표를 읽을 수 없다"
            description: "Prometheus 가 Worker /metrics(9102)를 5분 넘게 못 긁는다. PodMonitor worker·Worker Pod 의 metrics 포트를 확인한다. 이 동안 E2E·처리 오류 알림은 판단할 수 없다(지표 없음 != 0)."
    - name: parking-guardian.http
      rules:
        # 5xx 비율이 5% 를 넘는다 = 접수·관리자 API 오류(DB·S3·SQS 연결 문제 등). 헬스체크 라우트는 제외하고 "실제 트래픽" 기준으로 본다.
        # 오탐: 트래픽이 거의 없을 때 비율이 튄다 -> 분모(요청률)가 0.2 req/s 를 넘을 때만. 배포 중 짧은 503 -> for 5m.
        # 복구: 5분 평균 오류율이 5% 아래로 내려가면 자동 해소.
        - alert: PGHttp5xxRateHigh
          expr: |
            (
              sum(rate(http_request_duration_seconds_count{namespace="parking-guardian",status=~"5..",route!~".*/(healthz|readyz)"}[5m]))
              /
              sum(rate(http_request_duration_seconds_count{namespace="parking-guardian",route!~".*/(healthz|readyz)"}[5m]))
            ) > 0.05
            and
            sum(rate(http_request_duration_seconds_count{namespace="parking-guardian",route!~".*/(healthz|readyz)"}[5m])) > 0.2
          for: 5m
          labels:
            severity: critical
          annotations:
            summary: "HTTP 5xx 오류율 {{ $value | humanizePercentage }} (5분 평균)"
            description: "backend 의 5xx 비율이 5% 를 5분 넘게 초과했다(요청률 0.2 req/s 이상일 때만 평가). 접수가 실패하면 장비가 같은 event_id 로 재시도한다. kubectl -n parking-guardian logs deploy/backend"
    - name: parking-guardian.pods
      rules:
        # 컨테이너가 15분 안에 3번 이상 재시작했다 = CrashLoop·OOMKilled. 배포(롤링)는 재시작이 아니라 새 Pod 이므로 이 지표를 올리지 않는다.
        # 복구: 15분 창 안의 재시작이 2번 이하가 되면 해소(창이 지나가면 자동).
        - alert: PGPodCrashLooping
          expr: increase(kube_pod_container_status_restarts_total{namespace="parking-guardian"}[15m]) > 2
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }}/{{ $labels.container }} 가 15분 안에 {{ $value | printf \"%.0f\" }}번 재시작"
            description: "OOMKilled 또는 반복 실패 가능성. kubectl -n parking-guardian describe pod {{ $labels.pod }} 와 이전 로그(--previous)를 확인한다."
        # Pod 가 10분 넘게 Pending 이다 = 스케줄할 자리가 없다(노드 CPU 요청 한계·노드 장애).
        # 오탐: 새 Pod 가 막 만들어진 뒤 잠깐 Pending -> for 10m. 복구: 모든 Pod 가 Pending 에서 벗어남.
        - alert: PGPodPending
          expr: sum by (namespace, pod) (kube_pod_status_phase{namespace="parking-guardian",phase="Pending"}) > 0
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: "{{ $labels.pod }} 가 10분 넘게 Pending"
            description: "스케줄되지 못했다(노드 CPU 요청이 가득 찼거나 노드 문제). kubectl -n parking-guardian describe pod {{ $labels.pod }} 의 Events 를 확인한다."
    # --- 관측성 2단계: relay /metrics (PodMonitor relay). 모든 식이 max(...) 로 relay 복제 수와 무관하다(값이 같은 지표를 여러 Pod 가 내도 이중 계산 없음).
    #     값을 알 수 없을 때(스크레이프 실패·SQS 조회 권한 없음)는 지표가 "없음"이고 0 이 아니다 -> 아래 PGPipelineMetricsMissing 이 그 상태를 알린다.
    - name: parking-guardian.pipeline
      rules:
        # DLQ 에 메시지가 있거나 DLQ 로 간 작업(dead_lettered)이 다음 처리를 기다린다 = 세 번 실패한 사진이 있다(데이터 유실 위험).
        # 주의: Relay 가 매 회차(2초)마다 DLQ 를 읽어 작업을 dead_lettered 로 옮기고 DLQ 메시지를 지운다. 그래서 SQS DLQ 개수만 보면 거의 항상 0 이다.
        #   지속되는 신호는 DB 의 dead_lettered 작업 수(redrive 전까지 남는다)이므로 둘 중 하나라도 0 보다 크면 울린다(SQS 쪽은 읽을 수 없는 메시지가 DLQ 에 숨겨져 남는 경우).
        # 오탐: DLQ 로 막 이동한 메시지 1~2초 -> for 1m. 복구: DLQ 비어 있고 dead_lettered 작업이 0(원인 확인 뒤 flask jobs redrive 또는 정리).
        - alert: PGDLQHasMessages
          expr: |
            (sum(max by (queue, state) (pg_queue_messages{queue="dlq"})) > 0)
              or
            (max(pg_jobs{status="dead_lettered"}) > 0)
          for: 1m
          labels:
            severity: critical
          annotations:
            summary: "DLQ 메시지 또는 dead_lettered 작업 {{ $value }}건"
            description: "세 번 실패해 DLQ 로 간 사진 판정이 있다. SQS DLQ 메시지는 Relay 가 곧 dead_lettered 작업으로 옮기므로 pg_jobs{status=\"dead_lettered\"} 가 지속 신호다. 원인(Worker 로그, 이미지·모델 오류)을 본 뒤 flask jobs redrive."
        # 처리 대기 메시지(대기 + 처리 중)가 30건을 넘는 상태가 5분 이어진다 = 처리 용량 < 유입(KEDA 가 늘려도 못 따라감). SQS 의 근사값(ApproximateNumberOfMessages*)이다.
        # 오탐: 버스트 직후의 일시 적체(실험 2 에서 최대 33건, 수 초~수십 초) -> 30건·5m. 복구: 30건 이하.
        - alert: PGQueueBacklogSustained
          expr: sum(max by (state) (pg_queue_messages{queue="main",state=~"visible|not_visible"})) > 30
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "SQS 적체 {{ $value }}건(대기 + 처리 중)이 5분 넘게 이어짐"
            description: "판정 용량보다 사진 유입이 많다. Worker Ready 수와 KEDA 현재·목표 replica, 노드 자원을 확인한다. 큐 대기시간은 pg_oldest_open_job_age_seconds 와 E2E 지표(3단계)로 본다."
        # DB 기준 가장 오래된 미완료 작업 나이가 30초를 넘는 상태가 3분 이어진다. 미완료 = pending_publish·queued·processing, 기준 = detection_jobs.created_at, DB 시각.
        # SQS 의 ApproximateAgeOfOldestMessage 가 아니다(그것은 SQS 안의 메시지 나이, CloudWatch 지연·근사). 이 값은 발행 대기와 판정 중인 작업도 포함하고 Relay 회차(2초)마다 정확히 계산한다.
        # 오탐: 같은 장비의 사진이 연속으로 와서 앞 사진 뒤에서 기다리는 정상 직렬(FIFO 그룹)은 짧다 -> 30초·3m. 판정이 오래 걸리는 단일 작업도 올린다(그 자체가 이상).
        # 복구: 15초 안팎 이하로 내려가면(알림은 30초 미만이면 해소).
        - alert: PGPipelineOldestJobAge
          expr: max(pg_oldest_open_job_age_seconds) > 30
          for: 3m
          labels:
            severity: warning
          annotations:
            summary: "가장 오래된 미완료 작업 {{ $value | printf \"%.0f\" }}초 (DB 기준)"
            description: "pending_publish·queued·processing 중 가장 오래된 작업의 나이가 목표(E2E 10초)를 크게 넘는다. 발행(Relay)·큐·Worker 어디서든 정체될 수 있다. SQS 의 오래된 메시지 나이와 다른 값이다."
        # 이 파이프라인 지표 자체를 믿을 수 없다 = Relay 스크레이프 끊김, Relay 루프 정지(마지막 회차 2분 초과), 큐 깊이 조회 성공 기록 없음 또는 3분 넘게 없음.
        # "지표가 없어서 정상처럼 보이는" 오해를 막는 안전장치다. 큐 깊이를 못 읽는 가장 흔한 원인은 relay IAM 에 sqs:GetQueueAttributes 가 없는 것(배포 순서: IAM 먼저).
        # 복구: 스크레이프·루프·조회가 모두 정상으로 돌아오면.
        - alert: PGPipelineMetricsMissing
          expr: |
            absent(up{job="parking-guardian/relay"} == 1)
              or (time() - max(pg_relay_last_pass_timestamp_seconds) > 120)
              or absent(pg_queue_depth_last_success_timestamp_seconds)
              or (time() - max(pg_queue_depth_last_success_timestamp_seconds) > 180)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: "파이프라인 지표를 읽을 수 없다(Relay 스크레이프·루프 또는 SQS 큐 깊이 조회)"
            description: "Relay /metrics 가 수집되지 않거나, Relay 루프가 멈췄거나, 큐 깊이 조회가 실패한다(sqs:GetQueueAttributes 권한 확인). 이 동안 SQS 적체·DLQ 알림은 판단할 수 없다(지표 없음 != 0)."
