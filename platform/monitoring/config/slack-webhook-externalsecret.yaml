# Slack Incoming Webhook URL: Secrets Manager parking-guardian/slack -> Kubernetes Secret monitoring/slack-webhook (키 url).
# Alertmanager 가 이 Secret 을 파일로 마운트하고(values.yaml alertmanager.alertmanagerSpec.secrets) 설정에는 파일 경로만 적는다.
# 비밀 이름 parking-guardian/slack 은 infra data 스택이 만든 고정 문자열(계정 ID·ARN 아님)이라 그대로 적는다. URL 값은 Git·Terraform 어디에도 없고
# 사용자가 터미널에서 직접 put-secret-value 로 넣는다(docs/observability-stage1.md). ESO 의 IAM 정책(platform 스택 eso.tf)에 이 비밀의 ARN 이 있어야 읽힌다.
# 비밀 값이 아직 없으면 ExternalSecret 이 SecretSyncedError 로 재시도하고 Alertmanager Pod 는 ContainerCreating 에서 기다린다(값을 넣으면 스스로 시작).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: slack-webhook
  namespace: monitoring
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: slack-webhook
    creationPolicy: Owner
  data:
    - secretKey: url
      remoteRef:
        key: parking-guardian/slack
        property: url
