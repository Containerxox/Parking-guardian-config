# 클러스터 공용 오브젝트(platform/): ClusterSecretStore. 클러스터 범위라 destination.namespace 는 의미가 없지만 필수 필드라 argocd 로 둔다.
# 전제: infra platform 스택의 ESO(CRD)가 먼저 있어야 한다. 없으면 이 앱은 "CRD 없음" 으로 Sync 실패 상태에 머물다가 ESO 가 생기면 자동 복구된다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform
  namespace: argocd
  # Application 을 지우면 그 리소스(ClusterSecretStore)도 지운다. 삭제 순서: parking-guardian 앱 → platform 앱 → infra platform 스택.
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/Containerxox/Parking-guardian-config.git
    targetRevision: main
    path: platform
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
