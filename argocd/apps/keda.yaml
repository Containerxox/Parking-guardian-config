# KEDA (Phase 2): SQS 대기 수로 Worker 를 조절하는 이벤트 기반 오토스케일러. Helm 차트 kedacore/keda.
# 소스가 둘이다(multi-source, monitoring 앱과 같은 방식): 차트는 kedacore Helm 저장소에서, 값(platform/keda/values.yaml)은 이 config 리포에서.
#
# 이 앱이 하는 일: Namespace keda, CRD(ScaledObject / TriggerAuthentication 등), operator / metrics-apiserver / admission-webhooks.
# parking-guardian 앱이 하는 일: ScaledObject 와 TriggerAuthentication(worker-scaledobject.yaml). 그쪽은 CRD 가 생길 때까지 retry 한다.
#
# 적용 순서 의존성 (실패하지 않게):
#   1) infra: Pod Identity 연결 keda/keda-operator ↔ IAM 역할 (SQS GetQueueAttributes) — **아직 없음**. 없이 KEDA 가 뜨면 operator 에 AWS 자격 증명이
#      주입되지 않아 ScaledObject 가 "Unable to locate credentials" 로 Ready 가 안 된다(fallback 으로 Worker 는 1개 유지). 연결을 만든 뒤 operator 를 재시작한다.
#   2) 이 앱(CRD) → 3) parking-guardian 앱의 ScaledObject(sync-wave 5, SkipDryRunOnMissingResource, Application retry).
# 삭제 순서: **parking-guardian 앱 → keda 앱**. ScaledObject 에 KEDA 의 finalizer 가 있어서 KEDA 를 먼저 지우면 ScaledObject 가 영원히 지워지지 않는다.
#
# ServerSideApply: KEDA 의 CRD 는 커서 kubectl apply(client-side)의 last-applied 어노테이션 한도(256 KB)를 넘을 수 있다(monitoring 앱과 같은 이유).
# 접근: 외부에 노출하지 않는다. 지표 API(external.metrics.k8s.io)는 클러스터 안에서 HPA 만 쓴다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: keda
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://kedacore.github.io/charts
      chart: keda
      targetRevision: 2.21.0 # app v2.21.0 (2026-09-23 릴리스). 시험된 Kubernetes v1.34~v1.36
      helm:
        releaseName: keda
        valueFiles:
          - $values/platform/keda/values.yaml
    - repoURL: https://github.com/Containerxox/Parking-guardian-config.git
      targetRevision: main
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: keda
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 30s
        factor: 2
        maxDuration: 5m
