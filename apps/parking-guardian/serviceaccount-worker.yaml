# worker Pod 의 ServiceAccount (Phase 2, ADR 0019). 이름 worker 가 infra cluster 스택의 Pod Identity 연결
# (var.worker_service_account, iam_phase2.tf)과 계약이다. 이름이 다르면 Pod 가 AWS 자격 증명을 받지 못해
# SQS ReceiveMessage 와 S3 모델 다운로드가 "Unable to locate credentials" 로 실패한다.
# 권한(역할 parking-guardian-worker): SQS 본 큐 Receive/Delete/ChangeMessageVisibility, S3 inbox 읽기, violations 쓰기, 모델 읽기.
# backend·relay·inference 와 다른 ServiceAccount 라서 서로의 권한이 섞이지 않는다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: worker
  namespace: parking-guardian
automountServiceAccountToken: false # 앱이 Kubernetes API 를 호출하지 않는다. Pod Identity 자격 증명은 EKS 가 따로 주입한다
