# backend PodDisruptionBudget: 자발적 중단(노드 drain, eviction, 노드 그룹 업데이트) 때 서비스 중인 Pod 가 항상 1개 이상 남게 한다.
#
# Phase 1 설계(3.9): minAvailable 1. Prototype 은 50%(올림) 였다. 최소 2 ~ 최대 4 에서 50% 는 Pod 4개일 때 2개를 지키지만, API Pod 는
#   가볍고 시작이 빨라(모델 없음) 한 번에 하나만 내려가도 충분하다. 고정 숫자 1 은 "마지막 하나는 지킨다" 를 가장 단순하게 말한다.
# 대가: Pod 가 1개뿐인 비정상 상태(한 노드 장애로 하나가 Pending)에서는 drain 이 기다린다. 멈춘 것이 아니라 복구를 기다리는 것이다.
# 적용 범위: 자발적 중단에만. 갑작스러운 노드 장애는 막지 못한다 → 분산 배치(preferred)가 맡는다.
#   Deployment 의 롤링 업데이트는 PDB 를 보지 않는다 → 배포 중 가용성은 strategy(maxUnavailable 0)가 맡는다.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: backend
  namespace: parking-guardian
  labels:
    app.kubernetes.io/name: backend
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
