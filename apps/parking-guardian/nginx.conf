# frontend(nginx-unprivileged) 의 Kubernetes 용 설정. 앱 리포 frontend/nginx.conf(Docker Compose 용)와의 차이:
#   빠진 것  location /api/ 프록시 블록, resolver 127.0.0.11(Docker DNS), client_max_body_size
#            → Kubernetes 에서는 ALB Ingress 가 /api/* 를 backend Service 로 직접 보낸다. nginx 는 정적 파일만 낸다.
#              (nginx 가 프록시하면 측정에 nginx 홉이 섞이고, 업로드 15 MB 가 nginx 를 거친다. 설계 4.4 "대안(버림)")
#   더한 것   location = /healthz  → readiness/liveness probe 용. 로그에 남기지 않는다.
# 이미지 안의 /etc/nginx/conf.d/default.conf 를 이 파일로 덮어쓴다(frontend Deployment 의 subPath 마운트).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # kubelet probe. 파일 시스템을 건드리지 않고 200 만 돌려준다.
    location = /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # React 빌드 산출물은 파일 이름에 내용 해시가 있어 오래 캐시해도 안전하다.
    location /static/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 그 외 경로는 React 앱의 페이지(클라이언트 라우팅). 파일이 없으면 index.html.
    location / {
        try_files $uri /index.html;
    }

    # index.html 은 새 배포를 바로 받도록 캐시하지 않는다.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
