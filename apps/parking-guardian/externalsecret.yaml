# Secrets Manager 비밀 3개 → Kubernetes Secret backend-secrets 1개. ESO 가 주기적으로 읽어 동기화한다.
#
# 여기에는 비밀의 "이름" 과 "키 이름" 만 있다. 값은 Secrets Manager 에만 있고 Git·매니페스트·Terraform 어디에도 없다.
# remoteRef.key 의 SECRET_NAME_APP / SECRET_NAME_SEED / RDS_SECRET_ARN 은 자리표시자다.
#   kustomization.yaml 의 replacements 가 ConfigMap backend-config(config.env)의 같은 이름 값으로 바꾼다.
#   RDS 비밀은 이름이 "rds!db-<uuid>" 로 예측 불가해서 ARN 으로 가리킨다(ESO 는 key 에 이름·ARN 둘 다 받는다).
#
# 결과 Secret backend-secrets 의 키 6개를 backend Deployment 가 envFrom 으로 환경변수로 받는다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backend-secrets
  namespace: parking-guardian
spec:
  # Secrets Manager 를 다시 읽는 주기. RDS 비밀은 7일마다 회전하므로 1시간이면 충분하다.
  # (회전 뒤 최대 1시간 동안 옛 비밀번호가 Secret 에 남지만, RDS 관리형 회전은 옛 비밀번호도 한동안 유효하게 둔다.)
  refreshInterval: 1h

  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager

  target:
    name: backend-secrets
    creationPolicy: Owner # Secret 을 ESO 가 만들고 소유한다. ExternalSecret 을 지우면 Secret 도 지워진다

  data:
    # --- parking-guardian/app: Flask 세션·JWT 서명 ---
    - secretKey: SECRET_KEY
      remoteRef:
        key: SECRET_NAME_APP
        property: SECRET_KEY # 비밀 값은 JSON 한 덩어리. 그중 이 키
    - secretKey: JWT_SECRET
      remoteRef:
        key: SECRET_NAME_APP
        property: JWT_SECRET

    # --- parking-guardian/seed: 데모 관리자 비밀번호, 장비 키 유도 비밀 ---
    - secretKey: SEED_ADMIN_PASSWORD
      remoteRef:
        key: SECRET_NAME_SEED
        property: SEED_ADMIN_PASSWORD
    - secretKey: SEED_DEVICE_KEY_SECRET
      remoteRef:
        key: SECRET_NAME_SEED
        property: SEED_DEVICE_KEY_SECRET

    # --- RDS 관리형 마스터 비밀: {"username": "...", "password": "..."} → 앱의 DB_USER / DB_PASSWORD ---
    - secretKey: DB_USER
      remoteRef:
        key: RDS_SECRET_ARN
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: RDS_SECRET_ARN
        property: password
