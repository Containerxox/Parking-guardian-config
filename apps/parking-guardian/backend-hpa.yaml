# backend(API) HPA: CPU 사용률로 Pod 수를 조절한다. 최소 2개(무중단), 최대 3개.
#
# 최대 3 은 **3노드 실험 환경의 시작 기준**이다(2026-10-30 사용자 결정). 운영 환경의 최종 확장 한도가 아니다. 노드 자원과 실제 Pod 배치를
#   확인해(V1) 확정한다.
#
# 최소 2개인 이유(무중단 운영): Pod 1개면 그 Pod 의 재시작·노드 교체·배포가 곧 API 중단이다. 2개를 가능하면 서로 다른 노드에 두면
#   (backend-deployment.yaml 의 preferred anti-affinity) 하나가 죽어도 다른 하나가 서비스한다.
#
# 왜 CPU 인가: 시작값이다. Phase 1 의 API 는 DB 와 AI 응답을 기다리는 시간이 길어 CPU 가 낮게 나올 수 있다. 사진이 몰려 AI 를 기다리는
#   스레드가 늘어도 CPU 는 오르지 않을 수 있으므로, 이 HPA 가 AI 포화에 반응하지 않는다는 것이 S1/S4 에서 확인할 항목이다
#   (대기 수 기반 확장은 Phase 2 의 KEDA). 요청 200m 의 70% 는 140m 이고 이 값은 S0 의 실측 사용량으로 다시 정한다.
# 왜 4 가 아니라 3 인가: api 4 + inference 3 은 CPU 요청상 3노드에 들어가지 않는다(api 4번째가 Pending). api 3 + inference 3 은 들어간다
#   (노드마다 inference 1 + api 1, 여유 30m). 단 **이 최대 상태에서 롤링 업데이트를 하면 surge Pod 한 개가 들어갈 자리가 없다**:
#   maxUnavailable 0 이라 서비스는 끊기지 않고 롤링이 부하가 빠져 HPA 가 줄어들 때까지 기다린다(중단이 아니라 지연). 계산은 scripts/check-placement.py.
#
# Deployment 에서 replicas 를 지운 이유: Git 에 replicas: 1 이 남아 있으면 HPA 가 2 로 올릴 때 Argo CD selfHeal 이 1 로 되돌린다.
#   replicas 필드가 없으면 Argo CD 는 그 필드를 비교하지 않는다(Kubernetes 문서도 HPA 대상에선 replicas 를 빼라고 권한다).
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: backend
  namespace: parking-guardian
  labels:
    app.kubernetes.io/name: backend
  annotations:
    argocd.argoproj.io/sync-wave: "3" # 대상 Deployment(wave 2)보다 뒤. wave 0 이면 대상이 없어 Degraded → Argo CD 가 wave 1·2 로 못 넘어간다
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: backend
  minReplicas: 2 # 무중단: 가능하면 서로 다른 노드에 하나씩
  maxReplicas: 3 # 3노드 실험 환경의 시작 기준. 최종 한도가 아니다
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70 # 요청(200m) 대비. metrics-server 가 15초마다 재는 값의 평균
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0 # 올릴 땐 바로
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleDown:
      # API Pod 는 가볍다(이미지 압축 84 MB, 모델 없음). 시작이 빨라 Prototype(300초)보다 짧게 둔다.
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
