# frontend Pod 의 고정 주소. Ingress 규칙 /* 가 가리킨다. ALB IP 타깃 모드라 ClusterIP 로 충분.
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: parking-guardian
  labels:
    app.kubernetes.io/name: frontend
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: frontend
  ports:
    - name: http
      port: 8080
      targetPort: http
