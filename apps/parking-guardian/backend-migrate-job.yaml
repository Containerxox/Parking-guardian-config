# backend-migrate: 배포 전에 DB 마이그레이션(과 데모 시드)을 "한 번만" 실행하는 Job.
#
# 왜 필요한가: backend 컨테이너가 시작할 때마다 flask db upgrade 를 하던 방식은 Pod 가 1개일 때만 안전하다.
#   HPA 로 Pod 가 2개가 되면 둘이 동시에 alembic_version 테이블을 고치려다 충돌한다(ADR 0013 "나중에 바꿀 것").
#   그래서 Deployment 에는 MIGRATE_ON_START=0 을 주고(ConfigMap), 마이그레이션은 이 Job 이 배포마다 한 번 한다.
#
# 실행 순서(Argo CD sync-wave): ConfigMap·Secret(wave 0, 기본) → 이 Job(wave 1) → Deployment(wave 2).
#   Argo CD 는 앞 wave 가 Healthy(Job 은 Complete)가 된 뒤에만 다음 wave 를 적용한다. Job 이 실패하면 sync 가 실패하고
#   Deployment 는 옛 이미지 그대로 남는다(마이그레이션 안 된 스키마로 새 코드가 뜨는 일이 없다).
#   PreSync hook 을 쓰지 않은 이유: hook 은 ConfigMap 보다 먼저 돌아서, 해시가 바뀐 새 backend-config 를 아직 찾지 못한다.
#
# 다시 실행되는 조건: Job 의 spec 은 불변(immutable)이라 Argo CD 는 바뀐 Job 을 "수정" 할 수 없다. sync-options 의
#   Replace=true 로 지우고 다시 만든다. 이미지 태그가 바뀌는 배포마다 spec 이 달라지므로 그때마다 새로 돈다.
#   태그가 같으면(예: nginx.conf 만 바뀜) Job 은 그대로이고 다시 돌지 않는다. flask db upgrade 는 이미 최신이면 아무것도 안 한다.
#
# 이미지는 backend 와 같다(images: 태그 + replacements 레지스트리). torch 는 추론 때만 import 되므로 이 Job 은 모델이 필요 없고
# 메모리도 수백 MB 로 충분하다. AWS 권한도 필요 없다(RDS 만 접속) → 기본 ServiceAccount, 토큰 마운트 없음.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  namespace: parking-guardian
  labels:
    app.kubernetes.io/name: backend-migrate
  annotations:
    argocd.argoproj.io/sync-wave: "1"
    argocd.argoproj.io/sync-options: Replace=true
spec:
  backoffLimit: 2              # 3번 실패하면 Job 실패 → sync 실패. 일시적 DB 접속 오류 1~2회는 넘긴다
  activeDeadlineSeconds: 600   # 10분 안에 끝나야 한다(마이그레이션은 보통 수 초)
  ttlSecondsAfterFinished: 86400 # 끝난 Pod 와 로그를 하루 남긴다(kubectl logs job/backend-migrate 로 확인)
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend-migrate
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: migrate
          image: parking-guardian/backend:placeholder # images: + replacements 가 채운다(backend Deployment 와 같은 규칙)
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          # SEED_DEMO_DATA 는 ConfigMap 의 고정값(1). flask seed 는 "없는 것만" 만들므로 반복 실행에 안전하다.
          args:
            - |
              set -e
              echo "migrate start $(date -u +%Y-%m-%dT%H:%M:%SZ)"
              flask db upgrade
              if [ "$SEED_DEMO_DATA" = "1" ]; then flask seed; fi
              echo "migrate end   $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 512Mi
