# Phase 2 "비교 구성" 패치 (사용하지 않는 예시 파일. kustomization.yaml 의 resources 에 들어 있지 않아 지금은 아무 영향이 없다).
#
# 언제 쓰나: 3노드(노드당 앱 가용 CPU 1280m)에서 Phase 2 를 부하 테스트·비교 측정할 때. 설계 비교 A "동일 자원": Phase 1 의 inference 2개 자리를
#   Worker 가 쓴다(api 2 + Worker 2 + Relay). 공존 구성(inference 2 + Worker 1)은 Worker 가 떠 있는 동안 마이그레이션 Job 과 inference 롤링이 막힌다
#   (scripts/check-phase2-render.py 의 배치 계산, docs/phase2.md 4절).
#
# [2026-11-05 Worker 확장 검증] 아래 ScaledObject 값(min / max / fallback)은 지금 **3 / 3 / 3**(Worker 3개 고정, 실험 2 의 Worker 3개 회차)이다. 기본 구성은 2 / 2 / 2. 확장 검증 중 쓴 값: 고정 3 / 3 / 3, 고정 4 / 4 / 4, KEDA 2 / 4 / 2. 값이 같은 숫자 N(2~4)이면
#   고정형이다(scripts/check-phase2-render.py 가 인정). 되돌리려면 세 값을 2 로 바꾼다. 문서 docs/phase2-comparison-run-2026-11-05.md 8절.
# 하는 일: inference Deployment / Service / HPA / PDB / PodMonitor 를 지우고, Worker 를 **최소 2 / 최대 2 로 고정**한다(2026-11-05 실험 1 의 Phase 2 비교 구성:
#   Phase 1 의 inference 2개 = Worker 2개, 같은 AI CPU 요청 2000m. min=max 이므로 KEDA 가 개수를 바꾸지 못한다 = 자동 확장 없음. fallback 도 2 로 맞춰 읽기 오류 때도 2 를 유지한다.
#   예전 안은 최소 1 / 최대 3 이었다: 실험에서는 Worker 수가 변수가 되므로 쓰지 않는다. KEDA 자동 확장 실험(P2-K)이 필요하면 이 값을 1/3 으로 되돌린다).
#   남는 것: inference ServiceAccount·ConfigMap(해가 없다). API 의 INFERENCE_BACKEND=http 는 그대로이고, Phase 1 동기 경로(POST /device/detections)만 503 이 된다.
#   Phase 2 접수 API(POST /device/detection-jobs)는 영향이 없다.
#
# 쓰는 방법 (GitOps: 손으로 kubectl 을 치면 Argo CD selfHeal 이 되돌린다):
#   1) 이 파일의 `patches:` 블록 전체를 kustomization.yaml 맨 끝에 붙인다  2) scripts/check-phase2-render.py 로 확인  3) 커밋·푸시 → Argo CD 가 동기화
#   되돌리려면 붙인 블록을 지운다. 검증 스크립트가 이 파일을 임시 복사본에 붙여 렌더링해 본다(저장소의 kustomization.yaml 은 바뀌지 않는다).
#   삭제 패치에는 metadata.namespace 가 있어야 한다(Namespace 변환이 패치보다 먼저 적용된다).
#
# 주의: Worker 3개 + 마이그레이션 Job 은 노드에 들어가지 않는다(배치 계산). 비교 구성에서 Worker 를 3 으로 올렸다면 배포(이미지 태그 변경)는 Worker 를 2 이하로
#   내린 뒤에 한다.
patches:
  - patch: |-
      $patch: delete
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: inference
        namespace: parking-guardian
  - patch: |-
      $patch: delete
      apiVersion: v1
      kind: Service
      metadata:
        name: inference
        namespace: parking-guardian
  - patch: |-
      $patch: delete
      apiVersion: autoscaling/v2
      kind: HorizontalPodAutoscaler
      metadata:
        name: inference
        namespace: parking-guardian
  - patch: |-
      $patch: delete
      apiVersion: policy/v1
      kind: PodDisruptionBudget
      metadata:
        name: inference
        namespace: parking-guardian
  - patch: |-
      $patch: delete
      apiVersion: monitoring.coreos.com/v1
      kind: PodMonitor
      metadata:
        name: inference
        namespace: parking-guardian
  - target:
      kind: ScaledObject
      name: worker
    patch: |-
      - op: replace
        path: /spec/minReplicaCount
        value: 3
      - op: replace
        path: /spec/maxReplicaCount
        value: 3
      - op: replace
        path: /spec/fallback/replicas
        value: 3
