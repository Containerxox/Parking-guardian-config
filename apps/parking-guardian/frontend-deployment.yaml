# frontend: React 빌드 결과를 내는 nginx(비특권 이미지, 8080). Pod 1개.
# nginx 설정은 ConfigMap frontend-nginx(kustomization.yaml 생성기, 원본 nginx.conf)를 default.conf 자리에 덮어쓴다.
# 이미지 주소는 backend 와 같은 방식(images: 태그 + replacements 레지스트리).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: parking-guardian
  labels:
    app.kubernetes.io/name: frontend
spec:
  replicas: 1

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: frontend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: frontend
    spec:
      # AWS 권한이 필요 없다. 기본 ServiceAccount 를 쓰되 토큰은 마운트하지 않는다.
      automountServiceAccountToken: false

      volumes:
        - name: nginx-conf
          configMap:
            name: frontend-nginx # kustomize 가 해시 붙은 이름으로 바꿔 준다

      containers:
        - name: frontend
          image: parking-guardian/frontend:placeholder # images: + replacements 가 채운다
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 8080

          volumeMounts:
            # 파일 하나만 덮어쓴다. subPath 가 없으면 conf.d 디렉터리 전체가 ConfigMap 으로 바뀌어 다른 설정이 사라진다.
            # subPath 마운트는 ConfigMap 이 바뀌어도 자동 갱신되지 않지만, 생성기 해시로 Pod 가 재시작되므로 문제없다.
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: nginx.conf
              readOnly: true

          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 128Mi

          # nginx.conf 의 location = /healthz (파일 시스템 안 봄, 로그 제외)
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
