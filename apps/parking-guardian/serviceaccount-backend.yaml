# backend Pod 의 신원. AWS 권한(S3 사진 Put/Get/Head, 모델 Get/List)은 EKS Pod Identity 가
# "클러스터 + Namespace + 이 ServiceAccount 이름" 에 IAM 역할을 연결해서 준다(infra cluster 스택).
# IRSA 와 달리 여기에 역할 ARN 어노테이션을 적지 않는다. 그래서 이 파일에는 계정 ID 가 없다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend
  namespace: parking-guardian
automountServiceAccountToken: false # 앱이 Kubernetes API 를 호출하지 않으므로 토큰을 마운트하지 않는다
