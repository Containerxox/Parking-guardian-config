# backend (= API): Flask API. Phase 1 부터 AI 추론은 별도 Deployment(inference-deployment.yaml)이고, 이 Pod 는 HTTP 로 부른다.
# 이미지는 Dockerfile 의 `api` 타깃(torch / YOLOv5 / OpenCV 없음). 모델 다운로드 initContainer 와 모델 볼륨은 inference 로 옮겼다.
# Pod 수는 HPA(backend-hpa.yaml)가 정한다(최소 2개).
#
# 시작 순서: backend 컨테이너(gunicorn 기동 → /readyz 가 DB 만 확인하고 200). AI 서비스의 상태는 readiness 에 넣지 않는다:
#   AI 가 죽거나 모델을 읽는 중이어도 관리자 API 는 계속 서비스하고, 사진 탐지만 503(inference_unavailable)이 된다(ADR 0018).
#   DB 마이그레이션은 여기서 하지 않는다(MIGRATE_ON_START=0, ConfigMap). 배포마다 backend-migrate Job 이 먼저 한다(sync-wave 1 → 2).
# 이미지 주소: "parking-guardian/backend:<태그>" 는 자리표시자. kustomization.yaml 의 images: 가 태그를, replacements 가
#   레지스트리 주소(config.env 의 ECR_BACKEND)를 채운다. 그래서 이 파일에 계정 ID 가 없다.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: parking-guardian
  labels:
    app.kubernetes.io/name: backend
  annotations:
    argocd.argoproj.io/sync-wave: "2" # backend-migrate Job(wave 1)이 Complete 된 뒤에 적용
spec:
  # replicas 없음: HPA 가 관리한다. 여기 값을 두면 Argo CD selfHeal 이 HPA 의 결정을 되돌린다(backend-hpa.yaml 참고).

  # 롤링 업데이트(무중단): maxSurge 1, maxUnavailable 0 → 새 Pod 하나가 Ready 가 된 뒤에야 옛 Pod 하나를 내린다.
  #   Phase 1 의 api Pod 는 요청 200m 라 surge 자리 찾기가 Prototype(1코어)보다 쉽다(설계 3.7.1).
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app.kubernetes.io/name: backend

  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: backend # Pod Identity 로 사진 버킷 Put/Get 만 (모델 권한은 inference 로 옮겼다)
      automountServiceAccountToken: false

      # 분산은 "가능하면" 이다(preferred). Prototype 은 required 였지만, 3노드에서 API 와 AI 가 공존하려면 api 끼리도 한 노드에
      # 몰릴 수 있게 열어 두어야 Pending 이 없다(설계 3.7.1). 몰렸는지는 배포 뒤 `kubectl get pods -o wide` 로 본다(V1).
      #   topologySpreadConstraints(zone, ScheduleAnyway) → 가능하면 AZ a/c 에 하나씩. 못 맞추면 그냥 띄운다.
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: backend
                topologyKey: kubernetes.io/hostname
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: backend

      # gunicorn graceful_timeout 은 기본 30초다(Prototype 은 130초로 적었지만 gunicorn 이 30초 뒤 요청을 끊어 130초는 의미가 없었다).
      # 가장 긴 정상 요청은 AI 마감(AI_CLIENT_DEADLINE 10초) + DB 라 30초면 충분하고, 여유 15초를 더해 45초.
      terminationGracePeriodSeconds: 45

      containers:
        - name: backend
          image: parking-guardian/backend:placeholder # images: + replacements 가 채운다
          # 태그가 불변이라 같은 태그 = 같은 이미지. 노드에 있으면 다시 받지 않는다(이미지 Pull 시간 측정의 "캐시 있음/없음" 구분).
          imagePullPolicy: IfNotPresent

          ports:
            - name: http
              containerPort: 5000
            - name: metrics
              containerPort: 9102 # Prometheus /metrics (앱 METRICS_PORT 기본값). backend-podmonitor.yaml 이 이 이름으로 긁는다. Service 에는 넣지 않는다

          # 환경변수 = ConfigMap(Terraform 출력값 + 고정값 + AI 연결 설정) + Secret(ESO 가 만든 backend-secrets).
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: backend-secrets

          # 요청은 [추정]이다. Phase 1 API 는 torch 가 없어 가볍다(로컬 api 이미지 압축 84 MB). 실제 사용량(S0)을 본 뒤 정하고 HPA % 도 그에 맞춘다.
          # CPU limit 은 두지 않는다. 메모리 limit 은 요청의 2배.
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              memory: 512Mi

          # /healthz: 프로세스 생존(의존성 안 봄). /readyz: DB 에 SELECT 1 (AI 상태는 보지 않는다).
          # startup 이 성공하기 전엔 liveness·readiness 가 쉰다. gunicorn 기동만 보므로 60초(5초 × 12)면 넉넉하다(마이그레이션은 Job 으로 뺐다).
          startupProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 10
            failureThreshold: 3
