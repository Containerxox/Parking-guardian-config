# inference Pod 의 ServiceAccount. 이름 inference 가 infra cluster 스택의 Pod Identity 연결(var.inference_service_account)과 계약이다.
# 이름이 다르면 Pod 가 AWS 자격 증명을 받지 못해 initContainer 가 "Unable to locate credentials" 로 실패한다.
# backend 와 다른 ServiceAccount 라서 backend 의 사진 권한이 inference 에 가지 않는다(반대도 마찬가지).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: inference
  namespace: parking-guardian
automountServiceAccountToken: false # 앱이 Kubernetes API 를 호출하지 않으므로 토큰을 마운트하지 않는다
