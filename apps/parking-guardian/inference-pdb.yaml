# inference PodDisruptionBudget: 자발적 중단(노드 drain, eviction, 노드 그룹 업데이트) 때 서비스 중인 Pod 가 항상 1개 이상 남게 한다.
# Pod 2개 → 한 번에 하나만 내려가고, 내려간 Pod 가 다른 노드에서 모델을 읽고 Ready 가 된 뒤에야 다음을 내릴 수 있다.
# 대가: Pod 가 1개뿐인 비정상 상태에서는 drain 이 기다린다(멈춘 것이 아니라 복구를 기다리는 것).
# 갑작스러운 노드 장애는 막지 못한다 → 분산 배치(preferred)와 min 2 가 맡는다.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: inference
  namespace: parking-guardian
  labels:
    app.kubernetes.io/name: inference
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: inference
