# Worker·Relay 전용 Secret pipeline-secrets (Phase 2). Secrets Manager 의 RDS 관리형 비밀에서 DB 계정 2개만 가져온다.
#
# backend-secrets(externalsecret.yaml)를 같이 쓰지 않는 이유 (최소 권한):
#   backend-secrets 에는 JWT 서명 키(JWT_SECRET)와 Flask 세션 키, 시드 관리자 비밀번호, 장비 키 유도 비밀이 들어 있다.
#   Worker 와 Relay 는 로그인도 장비 인증도 하지 않으므로 이 값이 필요 없고, 이 Pod 가 뚫렸을 때 관리자 토큰을 위조할 수 있게 하면 안 된다.
#   앱 설정은 SECRET_KEY/JWT_SECRET 이 없어도 기동한다(config.py 의 기본값을 쓰고, 이 프로세스는 그 값을 쓰지 않는다).
# 여기에는 비밀의 "이름" 과 "키 이름" 만 있다. RDS_SECRET_ARN 은 자리표시자이고 kustomization.yaml 의 replacements 가 config.env 의 값으로 바꾼다.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pipeline-secrets
  namespace: parking-guardian
spec:
  refreshInterval: 1h # RDS 비밀은 7일마다 회전한다. backend-secrets 와 같은 주기. (회전 뒤 Pod 재시작 문제는 docs/phase2.md 의 위험 항목)

  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager

  target:
    name: pipeline-secrets
    creationPolicy: Owner

  data:
    - secretKey: DB_USER
      remoteRef:
        key: RDS_SECRET_ARN
        property: username
    - secretKey: DB_PASSWORD
      remoteRef:
        key: RDS_SECRET_ARN
        property: password
