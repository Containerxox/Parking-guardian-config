# relay Pod 의 ServiceAccount (Phase 2, ADR 0019). 이름 relay 가 infra cluster 스택의 Pod Identity 연결
# (var.relay_service_account, iam_phase2.tf)과 계약이다.
# 권한(역할 parking-guardian-relay): SQS 본 큐 SendMessage, DLQ Receive/Delete/ChangeMessageVisibility,
# S3 inbox 읽기·violations 쓰기(끊긴 부수 효과 = 증거 사진 복사를 마무리한다). 모델 권한은 없다.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: relay
  namespace: parking-guardian
automountServiceAccountToken: false # 앱이 Kubernetes API 를 호출하지 않는다. Pod Identity 자격 증명은 EKS 가 따로 주입한다
